x-huggingface-environment: &huggingface-environment
  HF_HOME: /models/huggingface
  HF_HUB_CACHE: /models/huggingface/hub
  HF_TOKEN: ${HF_TOKEN:-}

x-huggingface-cache-volume: &huggingface-cache-volume
  - ${SEEDMARK_MODEL_CACHE:-../seedmark-model-cache}:/models/huggingface

services:
  # The real chat experiment is the default repository experience.
  # `docker compose up --build` downloads/caches Qwen once, asks "What is AI?",
  # generates matched watermarked/control assistant answers, and serves the report.
  qwen-cache:
    build:
      context: .
      dockerfile: Dockerfile.qwen
    command:
      - qwen-cache
      - --model
      - Qwen/Qwen3.5-0.8B
    environment: *huggingface-environment
    volumes: *huggingface-cache-volume

  qwen:
    build:
      context: .
      dockerfile: Dockerfile.qwen
    command:
      - qwen-demo
      - --model
      - Qwen/Qwen3.5-0.8B
      - --question
      - What is AI?
      - --max-new-tokens
      - "128"
      - --top-k
      - "20"
      - --output-dir
      - /workspace/results/qwen
    environment: *huggingface-environment
    depends_on:
      qwen-cache:
        condition: service_completed_successfully
    volumes:
      - ./results:/workspace/results
      - ${SEEDMARK_MODEL_CACHE:-../seedmark-model-cache}:/models/huggingface

  qwen-report:
    image: python:3.13-slim
    working_dir: /workspace/results/qwen
    command: ["python", "-m", "http.server", "8081", "--bind", "0.0.0.0"]
    depends_on:
      qwen:
        condition: service_completed_successfully
    volumes:
      - ./results:/workspace/results:ro
    ports:
      - "8081:8081"

  # The transparent bigram experiment remains available, but it is now explicitly
  # opt-in because it is a teaching baseline rather than the realistic chat demo.
  experiment:
    profiles: ["toy"]
    build:
      context: .
    command:
      - experiment
      - --output-dir
      - /workspace/results/run
      - --trials
      - "300"
      - --length
      - "80"
      - --first-word
      - research
      - --experiment-seed
      - "20260817"
    volumes:
      - ./results:/workspace/results

  report:
    profiles: ["toy"]
    image: python:3.13-slim
    working_dir: /workspace/results/run
    command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    depends_on:
      experiment:
        condition: service_completed_successfully
    volumes:
      - ./results:/workspace/results:ro
    ports:
      - "8080:8080"
