name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify CLI version
        run: python -m seedmark.cli --version
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Reproducible experiment
        run: python -m seedmark.cli experiment --output-dir results/ci --trials 100 --length 70 --experiment-seed 20260817
      - name: Upload scientific report
        uses: actions/upload-artifact@v4
        with:
          name: seedmark-report
          path: results/ci/
          if-no-files-found: error

  animation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install animation dependency
        run: python -m pip install "pillow>=11.0,<13"
      - name: Render and verify generation + detection GIFs
        run: python tests/test_animation_render.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.13 image
        run: docker build -t seedmark:ci .
